# BEGIN TSB PORTFOLIO
server {
    listen 80;
    listen [::]:80;
    server_name tsb-dev.fr www.tsb-dev.fr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://tsb-dev.fr$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tsb-dev.fr;
    ssl_certificate /etc/letsencrypt/live/tsb-dev.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tsb-dev.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://tsb-dev.fr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tsb-dev.fr;
    ssl_certificate /etc/letsencrypt/live/tsb-dev.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tsb-dev.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        set $portfolio_origin http://tsb-portfolio-origin:80;
        proxy_pass $portfolio_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# END TSB PORTFOLIO
