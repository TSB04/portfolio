services:
  portfolio:
    image: nginx:1.28-alpine
    container_name: tsb-portfolio
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      ingress:
        aliases:
          - tsb-portfolio-origin
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/en/"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  ingress:
    external: true
    name: ${PORTFOLIO_DOCKER_NETWORK:?Set the private operator network configuration}
