server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;

    location = / { return 301 /en/$is_args$args; }
    location = /en { return 301 /en/$is_args$args; }
    location = /fr { return 301 /fr/$is_args$args; }
    location ~ ^/(en|fr)/card/?$ { return 301 /$1/$is_args$args; }

    location /_astro/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ (^|/)\. { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
    }
}
