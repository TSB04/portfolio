name: Portfolio CI and deployment

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run astro check
      - run: npm run test:github
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build static portfolio
        env:
          GITHUB_CLIENT_ID: ${{ secrets.PORTFOLIO_GITHUB_CLIENT_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.PORTFOLIO_GITHUB_INSTALLATION_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.PORTFOLIO_GITHUB_PRIVATE_KEY }}
        run: npm run build
      - run: npm run check:seo
      - name: Scan generated public output
        shell: bash
        run: |
          python3 scripts/check-public-repo.py --build
          "$RUNNER_TEMP/gitleaks" dir dist --redact --no-banner
      - run: python3 scripts/deploy.py package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portfolio-release
          path: |
            .deploy/portfolio.tar.gz
            .deploy/promote.py
            .deploy/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://tsb-dev.fr
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: portfolio-release
          path: release
      - name: Publish verified production bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="portfolio-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title "Portfolio ${GITHUB_SHA:0:12}" --notes "Validated production bundle for main commit ${GITHUB_SHA}."
          fi
      - name: Confirm production serves this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_BUILD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/verify-production.py --wait 600
